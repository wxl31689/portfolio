<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商家登录</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .login-box {
      width: 360px;
      margin: 120px auto;
      background: #fff;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 28px;
      text-align: center;
      color: #d81e06;
    }

    .form-item {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      height: 44px;
      background: #d81e06;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #b91604;
    }

    .tip {
      margin-top: 16px;
      color: #999;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>商家后台登录</h2>

    <div class="form-item">
      <label>账号</label>
      <input id="username" placeholder="请输入账号" value="admin">
    </div>

    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码" value="123456">
    </div>

    <button onclick="login()">登录</button>

    <div class="tip">默认账号：admin，密码：123456</div>
  </div>

  <script src="./js/config.js"></script>
  <script>
    function login() {
      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value.trim()

      if (!username || !password) {
        alert('请输入账号和密码')
        return
      }

      fetch(BASE_URL + '/api/admin/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username,
          password
        })
      })
      .then(res => res.json())
      .then(res => {
        console.log('登录返回：', res)

        if (res.code === 200) {
          localStorage.setItem('adminInfo', JSON.stringify(res.data))
          location.href = './dashboard.html'
        } else {
          alert(res.message || '登录失败')
        }
      })
      .catch(err => {
        console.error(err)
        alert('请求失败，请检查后端是否启动')
      })
    }
  </script>
</body>
</html>
